<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="shortcut icon" href="unnamed.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <h1>Booksky</h1>
    </div>

    <div class="container">
        <div class="book-container">
            <h2>Harry Potter and the Chamber of Secrets</h2>
            <h5>J. K. Rowling</h5>
            <P>Harry Potter and the Chamber of Secrets is a fantasy novel written by British author J. K. Rowling. It is
                the second novel in the Harry Potter series.</P>
            <button onclick="deletebook(event)">Delete</button>
        </div>

    </div>
    <div class="overlay"></div>
    <div class="popupbox">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="Book-title-input">
            <input type="text" placeholder="Book Author" id="Book-Author-input">
            <textarea placeholder="Short Description" id="Book-Description-input"></textarea>
            <button id="addbook">Add</button>
            <button id="cancelpopup">Cancel</button>
        </form>
    </div>

    <button class="add-btn" id="add-popup">+</button>
    <script src="script.js"></script>
</body>

</html>
